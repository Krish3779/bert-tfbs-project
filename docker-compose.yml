services:
  bert-tfbs:
    build: .
    image: bert-tfbs:latest
    working_dir: /workspace
    shm_size: "8gb"
    restart: unless-stopped
    volumes:
      - .:/workspace
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
